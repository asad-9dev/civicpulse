name: Scrape board agendas

on:
  schedule:
    # Every day at 11:00 UTC (6:00 AM EST / 7:00 AM EDT), so a newly posted agenda is on the
    # site within a day. Meetings already published are skipped, so quiet days change nothing.
    # The digest email (Vercel Cron, 14:00 UTC) runs three hours later, after the redeploy.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      board:
        description: "Which board to scrape"
        type: choice
        options: [all, ddsb, yrdsb]
        default: all
      refresh:
        description: "Re-summarize meetings that are already on the site (uses Gemini quota)"
        type: boolean
        default: false

permissions:
  contents: write # push the updated board files back to the repo

concurrency:
  group: scrape-agendas
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One board at a time: each job commits and pushes, and serialising them keeps those
      # pushes from racing. Each board writes only its own file, so one failing board still
      # leaves the others' summaries on the site.
      max-parallel: 1
      fail-fast: false
      matrix:
        # Boards with a scraper adapter (see backend/boards.py). TDSB and PDSB are both under
        # provincial supervision with no trustee meetings, so there is nothing to scrape.
        board: [ddsb, yrdsb]
    steps:
      - name: Skip boards not selected
        id: selection
        env:
          CHOSEN: ${{ inputs.board || 'all' }}
        run: |
          if [ "$CHOSEN" = "all" ] || [ "$CHOSEN" = "${{ matrix.board }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.board }}: this run asked for $CHOSEN."
          fi

      - name: Check out repository
        if: steps.selection.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        if: steps.selection.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.selection.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Chromium for Playwright
        if: steps.selection.outputs.run == 'true'
        # --with-deps also installs the Linux system libraries headless Chromium needs.
        run: python -m playwright install --with-deps chromium

      - name: Check Gemini key
        if: steps.selection.outputs.run == 'true'
        # Asks Google whether the key is valid (reading model info uses no summarizing quota).
        # A missing or rejected key turns this step red with a warning, but the run carries on:
        # the scrape below falls back to the built-in summarizer.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=Gemini key::The GEMINI_API_KEY secret is not set; meetings will get the built-in summary."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash")
          if [ "$status" != "200" ]; then
            echo "::warning title=Gemini key::Google rejected the GEMINI_API_KEY secret (HTTP $status); meetings will get the built-in summary."
            exit 1
          fi
          echo "Gemini key OK (HTTP $status)"

      - name: Scrape, summarize and update ${{ matrix.board }}
        if: steps.selection.outputs.run == 'true'
        env:
          # Google Gemini, free tier. If the secret is missing or Gemini is unavailable, each
          # meeting falls back to the built-in summarizer (with a warning on this run) and is
          # upgraded on a later run.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REFRESH: ${{ inputs.refresh }}
        # --write-public upserts into public/data/boards/<board>.json, skipping agendas that are
        # already published; --limit 10 keeps a busy week from pushing a new agenda out of the window.
        run: |
          args="--board ${{ matrix.board }} --months-back 1 --limit 10 --summarizer gemini --write-public"
          if [ "$REFRESH" = "true" ]; then args="$args --refresh"; fi
          python backend/scrape_agendas.py $args

      - name: Commit and push updated meetings
        if: steps.selection.outputs.run == 'true'
        env:
          BOARD_FILE: public/data/boards/${{ matrix.board }}.json
        run: |
          if git diff --quiet -- "$BOARD_FILE"; then
            echo "No new or revised ${{ matrix.board }} agendas; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BOARD_FILE"
          git commit -m "Update decoded ${{ matrix.board }} meetings ($(date -u +%Y-%m-%d))"
          # Another board's job may have pushed since checkout; rebase onto it and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error title=Push failed::Could not push the updated ${{ matrix.board }} meetings after 3 tries."
          exit 1

      - name: Keep downloaded agendas for debugging
        if: always() && steps.selection.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agendas-${{ matrix.board }}-${{ github.run_id }}
          path: |
            backend/agendas/${{ matrix.board }}/
            backend/output/
          if-no-files-found: ignore
          retention-days: 14
