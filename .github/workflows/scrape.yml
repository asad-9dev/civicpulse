name: Scrape board agendas

on:
  schedule:
    # Every day at 11:00 UTC (6:00 AM EST / 7:00 AM EDT), so a newly posted agenda is on the
    # site within a day. Meetings already published are skipped, so quiet days change nothing.
    # The digest email (Vercel Cron, 14:00 UTC) runs three hours later, after the redeploy.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      board:
        description: "One board's slug (blank = every live board)"
        type: string
        default: ""
      refresh:
        description: "Re-summarize meetings that are already on the site (uses Gemini quota)"
        type: boolean
        default: false

permissions:
  contents: write # push the updated board files back to the repo

concurrency:
  group: scrape-agendas
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Chromium for Playwright
        # --with-deps also installs the Linux system libraries headless Chromium needs.
        run: python -m playwright install --with-deps chromium

      - name: Check Gemini key
        # Asks Google whether the key is valid (reading model info uses no summarizing quota).
        # A missing or rejected key turns this step red with a warning, but the run carries on:
        # the scrape below falls back to the built-in summarizer.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=Gemini key::The GEMINI_API_KEY secret is not set; meetings will get the built-in summary."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash")
          if [ "$status" != "200" ]; then
            echo "::warning title=Gemini key::Google rejected the GEMINI_API_KEY secret (HTTP $status); meetings will get the built-in summary."
            exit 1
          fi
          echo "Gemini key OK (HTTP $status)"

      - name: Scrape and summarize
        env:
          # Google Gemini, free tier. If the secret is missing or Gemini is unavailable, each
          # meeting falls back to the built-in summarizer (with a warning on this run) and is
          # upgraded on a later run.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # For --embed, which stores each agenda's text and embeddings for /api/search. Without
          # these secrets embedding logs a warning and skips; the summaries still publish.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOARD: ${{ inputs.board }}
          REFRESH: ${{ inputs.refresh }}
        # run_all.py reads data/boards_config.json and scrapes whichever boards are marked live,
        # two at a time to stay inside Gemini's per-minute free-tier limit. Adding a board is a
        # registry edit; this workflow needs no change.
        run: |
          args="--summarizer gemini --write-public --embed --limit 10 --months-back 1 --concurrency 2"
          if [ -n "$BOARD" ]; then args="--board $BOARD $args"; else args="--all $args"; fi
          if [ "$REFRESH" = "true" ]; then args="$args --refresh"; fi
          python backend/run_all.py $args

      - name: Commit and push updated meetings
        run: |
          if git diff --quiet -- public/data/boards/ data/ingest_status.json; then
            echo "No new or revised agendas; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/boards/ data/ingest_status.json
          git commit -m "Update decoded board meetings ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error title=Push failed::Could not push the updated meetings after 3 tries."
          exit 1

      - name: Report which boards failed
        # run_all.py records every board's outcome; surface it on the run's summary page so a
        # board that quietly stopped working is visible without reading the log.
        if: always()
        run: |
          python backend/run_all.py --status || true
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, pathlib
          path = pathlib.Path("data/ingest_status.json")
          if not path.exists():
              raise SystemExit
          boards = json.loads(path.read_text(encoding="utf-8")).get("boards", {})
          ok = [b for b in boards.values() if b.get("ok")]
          bad = [b for b in boards.values() if not b.get("ok")]
          print(f"### Scrape: {len(ok)} succeeded, {len(bad)} failed\n")
          for entry in sorted(boards.values(), key=lambda e: (e.get("ok", False), e["slug"])):
              mark = "ok" if entry.get("ok") else "**failed**"
              print(f"- {mark} `{entry['slug']}` ({entry.get('platform','?')}, {entry.get('seconds','?')}s)")
          PY

      - name: Keep downloaded agendas for debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agendas-${{ github.run_id }}
          path: |
            backend/agendas/
            backend/output/
          if-no-files-found: ignore
          retention-days: 14
